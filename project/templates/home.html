<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Human-in-the-Loop AI Code Review</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f5f7fb; }
    .container { max-width: 900px; margin: auto; background: white; padding: 24px; border-radius: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; }
    button { padding: 10px 15px; background: #2563eb; color: white; border: none; border-radius: 6px; }
    .error { color: red; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Human-in-the-Loop AI Code Review</h1>
    <p>This application demonstrates an AI-assisted code review system where human reviewers validate AI suggestions.</p>
    <div class="grid">
      <div>
        <h2>Register</h2>
        <form method="post" action="/register">
          <input name="name" placeholder="Name">
          <input name="email" placeholder="Email">
          <input name="password" type="password" placeholder="Password">
          <button type="submit">Register</button>
        </form>
      </div>
      <div>
        <h2>Login</h2>
        <form method="post" action="/login">
          <input name="email" placeholder="Email">
          <input name="password" type="password" placeholder="Password">
          <button type="submit">Login</button>
        </form>
      </div>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
